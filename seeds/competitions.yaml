- name: FIFA World Cup
  team_kind: NATIONAL
  scope: INTERCONTINENTAL
  format: TOURNAMENT
  wikidata: Q19317
  standings:
    # Two points for a win; level teams shared the position, or met in a play-off when it
    # mattered (1954, 1958: standings.yaml)
    - from: 1930
      points: {win: 2, draw: 1, loss: 0}
      tiebreakers: []
    # 1962–1966: goal average separated level teams
    - from: 1962
      points: {win: 2, draw: 1, loss: 0}
      tiebreakers: [goal_ratio]
    # 1970: goal difference, then lots
    - from: 1970
      points: {win: 2, draw: 1, loss: 0}
      tiebreakers: [goal_difference]
    # From 1974: goal difference, goals scored, then lots
    - from: 1974
      points: {win: 2, draw: 1, loss: 0}
      tiebreakers: [goal_difference, goals_for]
    # From 1994: three points for a win; then head-to-head, fair play (2018–2022) and lots
    - from: 1994
      points: {win: 3, draw: 1, loss: 0}
      tiebreakers: [goal_difference, goals_for, h2h_points, h2h_goal_difference, h2h_goals_for]
    # FIFA World Cup 2026 regulations: head-to-head first, then overall goal difference and goals scored
    - from: 2026
      points: {win: 3, draw: 1, loss: 0}
