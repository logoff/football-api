- name: La Liga
  country: "ES"
  team_kind: CLUB
  scope: DOMESTIC
  format: LEAGUE
  wikidata: Q324867
  standings:
    # Two points for a win until 1994-95. No regulation text of the time was found online: the order
    # follows Wikipedia's final tables (head-to-head points among the tied clubs, then again among
    # those still level, then their head-to-head goal difference), checked once against every
    # 1929 to 1994-95 table whose results agree (la-liga-history-from-wikipedia D7).
    - from: 1929
      points: {win: 2, draw: 1, loss: 0}
      tiebreakers: [h2h_points, h2h_reapply, h2h_goal_difference, goal_difference, goals_for]
    # RFEF Reglamento General: head-to-head points and goal difference among the tied clubs, then
    # overall goal difference and goals scored. Head-to-head starts again among a smaller set still
    # level, which only 1995-96 needs (Oviedo above Athletic Club).
    - from: 1995
      points: {win: 3, draw: 1, loss: 0}
      tiebreakers: [h2h_points, h2h_goal_difference, h2h_reapply, goal_difference, goals_for]
  seasons:
    # 1929 to 2011-12 from the results grids of English Wikipedia's season articles, pinned by revision
    # (la-liga-history-from-wikipedia); their matches have no dates. 1936-37 to 1938-39 weren't played.
