# In-scope competitions and the source files for each ingested season (`seasons:`).
#
# format: LEAGUE (round-robin), CUP (knockout open to the national pyramid), LEAGUE_CUP (knockout
#         for league clubs only), SUPER_CUP (champions' play-off), TOURNAMENT (group or league phase,
#         then knockouts).
# tz: the time zone the file's kickoff times are written in, verified by hand.
#     `inline` means every match line carries its own `UTC±N` offset (sync fails otherwise).
# json: optional openfootball/football.json mirror, used only when it is current
#       (same match count as the text file and every match has a full-time score).
# squads: `more` = one file, `== Team` sections, capitalised surnames, full dates of birth;
#         `per-team` = one file per team, `=  Team - Tournament` header, birth years.
# wikipedia: optional English Wikipedia article whose results grid verifies the season's scores
#            (read only to compare; nothing from it is stored).
# Verification notes for each tz are in design.md ("Source coverage").

