- name: UEFA Champions League
  team_kind: CLUB
  scope: CONTINENTAL
  format: TOURNAMENT
  wikidata: Q18756
  standings:
    # Group stages from 1991-92, 2 points for a win until 1994-95. UEFA regulations art. 7.06 (quoted for
    # 1999-2000 to 2010-11): head-to-head points, goal difference and away goals, then overall goal
    # difference and goals. No regulation text found before 1999-2000; the same order matches every
    # Wikipedia group table from 1991-92 (Lens above Arsenal in 1998-99, Auxerre above Ajax in 1996-97),
    # while goal difference first doesn't. There were no groups before 1991-92; the era starts in 1955 so
    # every season has rules.
    - from: 1955
      points: {win: 2, draw: 1, loss: 0}
      tiebreakers: [h2h_points, h2h_goal_difference, h2h_away_goals_for, goal_difference, goals_for]
    - from: 1995
