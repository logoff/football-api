- name: UEFA European Championship
  team_kind: NATIONAL
  scope: CONTINENTAL
  format: TOURNAMENT
  wikidata: Q260858
  standings:
    # Two points for a win; goal difference, goals scored
    - from: 1960
      points: {win: 2, draw: 1, loss: 0}
      tiebreakers: [goal_difference, goals_for]
    # UEFA Euro regulations from 1996: three points, head-to-head among the tied teams first
    - from: 1996
      points: {win: 3, draw: 1, loss: 0}
      tiebreakers: [h2h_points, h2h_goal_difference, h2h_goals_for, goal_difference, goals_for]
    # From Euro 2016: head-to-head reapplied to smaller ties; then overall
    - from: 2016
      points: {win: 3, draw: 1, loss: 0}
      tiebreakers: [h2h_points, h2h_goal_difference, h2h_goals_for, h2h_reapply, goal_difference, goals_for, wins]
