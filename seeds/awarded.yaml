# How much of each awarded match was played (record-how-awarded-matches-ended).
#
# matches: one awarded match, keyed like standings.yaml awards (competition, season, home and
#   away QIDs).
# teams: every awarded match of a team on or after `from` (an expelled club's remaining
#   fixtures). A match entry wins over a team entry.
# played: FULL (played to the end, result changed afterwards), PARTIAL (abandoned) or NONE
#   (never kicked off).
#
# Every entry names an official source where one exists. Teams are Wikidata QIDs, as in teams.yaml.

