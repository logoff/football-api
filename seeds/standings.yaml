orders:
  # World Cup 1954 and 1958: level teams met again in a play-off for the last place in the
  # knockout stage; the play-off isn't part of the group table.
  - competition: Q19317
    season: "1954"
    order: [Q43310, Q483856] # Germany, Turkey
    reason: "Group 2 play-off: West Germany 7–2 Turkey"
    source: https://www.rsssf.org/tables/54full.html
  - competition: Q19317
    season: "1954"
    order: [Q165141, Q676899] # Switzerland, Italy
    reason: "Group 4 play-off: Switzerland 4–1 Italy"
    source: https://www.rsssf.org/tables/54full.html
  - competition: Q19317
    season: "1958"
    order: [Q190978, Q182072] # Northern Ireland, Czechoslovakia
    reason: "Group 1 play-off: Northern Ireland 2–1 Czechoslovakia (a.e.t.)"
    source: https://www.rsssf.org/tables/58full.html
  - competition: Q19317
    season: "1958"
    order: [Q180857, Q170561] # Wales, Hungary
    reason: "Group 3 play-off: Wales 2–1 Hungary"
    source: https://www.rsssf.org/tables/58full.html
  - competition: Q19317
    season: "1958"
    order: [Q189275, Q47762] # Soviet Union, England
    reason: "Group 4 play-off: Soviet Union 1–0 England"
    source: https://www.rsssf.org/tables/58full.html
  - competition: Q19317
    season: "1990"
    order: [Q163547, Q47050] # Republic of Ireland, Netherlands
    reason: "Group F: identical records, second place decided by drawing lots"
    source: https://www.offtheball.com/The-goldfish-bowl-that-decided-the-Republic-of-Irelands-World-Cup-fate-in-1990-238967
  # Ligue 1 2019-20 was stopped by COVID-19 and ranked by points per game, with equal values
  # separated by head-to-head (not goal difference, the usual first tie-breaker).
  - competition: Q13394
    season: "2019-20"
    order: [Q185163, Q208228] # OGC Nice, Stade de Reims
    reason: "Both 1.46 points per game; Nice ahead on head-to-head (2–0 at home, 1–1 away), LFP final ranking of 30 April 2020"
    source: https://www.ogcnice.com/en/article/36395/season-over-as-nice-finish-5th.html
  # Serie A decides title and relegation ties by a play-off (spareggio) since 2022-23.
  - competition: Q15804
    season: "2022-23"
    order: [Q8639, Q8615] # Hellas Verona, Spezia
    reason: "Relegation play-off on 11 June 2023 at the Mapei Stadium: Spezia 1–3 Hellas Verona"
    source: https://sport.sky.it/calcio/serie-a/partite/2022/giornata-39/spezia-verona/risultato-gol

