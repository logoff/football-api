# Curated standings decisions that results alone don't give (standings spec, "Curated adjustments").
#
# awards: an awarded match the source records with a level score and no goals awarded, that
#   still has a winner (the win counts, the goals stay as recorded).
# adjustments: points added to a team's table total (negative for a deduction), from `effective`
#   on (tables as of an earlier date leave them out). A decision later changed on appeal is a
#   further entry, so a table on any date shows what applied then.
# orders: the final order of teams level on every tie-breaker (a play-off, lots, fair play).
#
# Every entry names an official source where one exists. Teams are Wikidata QIDs, as in teams.yaml.

