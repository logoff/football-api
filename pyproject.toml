[project]
name = "football-api"
version = "0.1.0"
description = "Football statistics HTTP API sourced from openfootball (CC0) and Wikidata."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "logoff", email = "juliocarlos@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.4",
    "strawberry-graphql[fastapi]>=0.338.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-m 'not network'"
markers = [
    "db: requires a running PostgreSQL (see `just test`)",
    "network: talks to live public APIs; excluded by default, run with `just test -m network`",
]
