schema: spec-driven

context: |
  Domain: football (soccer) statistics SaaS API. Solo project.

  Stack: Python 3.12, uv (package manager), FastAPI, Pydantic v2,
  SQLAlchemy 2.0 (async, Mapped[]), asyncpg, Alembic, pyright strict.
  Task runner: just (justfile), not make.

  Data sources: openfootball/* GitHub repositories (CC0) as primary
  data; English Wikipedia match boxes (CC BY-SA 4.0) for seasons
  openfootball lacks, pinned by revision ID (change
  source-older-seasons-from-wikipedia; each season serves its source
  and license, each match its license); Wikidata SPARQL for canonical
  identifiers. Official archives (UEFA, LaLiga) forbid reuse. Team identity is
  hand-curated in seeds/teams.yaml (name, Wikidata QID, openfootball
  aliases). External IDs live only in external_ref; no source is
  privileged.

  Scope: 20 competitions. Domestic club leagues (6): every season
  openfootball has, up to 2026-27 (in progress), each score verified
  against the English Wikipedia season grid: Premier League from
  1992-93, Bundesliga 2010-11, La Liga 2012-13, Serie A 2013-14, Ligue 1
  2014-15 (changes
  verify-and-schedule-la-liga, extend-and-verify-top-leagues); La Liga
  also 1929 to 2011-12 from Wikipedia results grids, matches without
  dates (null kickoff_utc), unverified, known Wikipedia grid errors
  listed in the change (la-liga-history-from-wikipedia); Segunda
  División 2012-13 to 2024-25, complete seasons only (change
  add-segunda-division).
  Domestic cups (6): FA Cup, EFL Cup (league cup) and DFB-Pokal
  2018-19 to 2024-25, Copa del Rey and Coppa Italia 2020-21 to 2024-25,
  Coupe de France 2024-25 (change add-domestic-cups), each score
  verified against the Wikipedia match boxes (verify-domestic-cups).
  Competitions have a format: LEAGUE, CUP, LEAGUE_CUP, SUPER_CUP,
  TOURNAMENT. Super cups: no source data.
  International competitions (8): every edition openfootball has with
  a date for every match (change extend-international-history): UCL
  1955-56+ (1955-56 to 2010-11 from Wikipedia, unverified), UEL 2020-21+, UECL 2021-22+, Copa Libertadores 2012+, Club
  World Cup 2000+, World Cup 1930+, Euro 1960+ (not 1984, 1992), Copa
  América 2011, 2021, 2024; not verified yet. Deferred: AFCON and FIFA
  Intercontinental Cup 2024 (no source data), Copa Sudamericana
  (incomplete source data).

  Data depth: entities + schedule + final scores (incl. extra time and
  penalty shootouts); awarded matches flagged, with how much was played
  (FULL/PARTIAL/NONE) curated in seeds/awarded.yaml
  (record-how-awarded-matches-ended). Goal scorers and squads: full for WC, Euro,
  Copa América, Club World Cup; none elsewhere. Lineups, substitutions,
  cards, referee and attendance (change add-match-events): every World
  Cup and Club World Cup, and the 2025-26 seasons of the five leagues,
  from openfootball `-full` files named per season as `events:`.
  Coverage is reported per resource via a `coverage` field (per season:
  scorers, players, lineups, substitutions, cards).

  Competition schema uses two orthogonal fields: team_kind (CLUB |
  NATIONAL) and scope (DOMESTIC | CONTINENTAL | INTERCONTINENTAL).

  Identity: uuidv7 PKs everywhere. Child rows (goals, events) keep a
  UUID plus a unique (match_id, [side,] ordinal) key for idempotent
  sync. Matches keyed by (season, stage, home, away); kickoff is an attribute.
  Player names: display_name from source; given/family only when the
  source marks the surname or from Wikidata; never split by guessing.
  Name matching is case- and accent-insensitive. Minutes are
  minute + added_minute.

  Style: REST + OpenAPI under /v1, cursor pagination, ?expand= for
  nesting. UUIDs are the only identifiers, in paths and filters (*_id
  params); there are no slugs. Timestamps in UTC (source offset on the line, else per-file
  configured time zone).

  Auth: none in app code. Local/compose binds to 127.0.0.1; public
  deployments are read-only and rate-limited at a reverse proxy.
  Deployment manifests live outside this repo. API keys come with a
  future gateway change.

  Deployment: Docker Compose with locally built images (api + postgres).
  Self-hosted.
